spring:
  datasource:
    url: jdbc:sqlite:data/chatai.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite WAL 模式支持多读单写：小池提升读并发，写冲突由 busy_timeout 自动等待重试
      maximum-pool-size: 4
      minimum-idle: 1
      # 每个连接建立时下发的 SQLite PRAGMA（sqlite-jdbc 支持的连接属性）
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
        synchronous: NORMAL
  servlet:
    multipart:
      # 聊天图片/附件文档上传限制（业务层另有图片 5MB、文档 3MB 校验）
      max-file-size: 6MB
      max-request-size: 12MB
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
    content-type: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  codec:
    max-in-memory-size: 16MB
  mvc:
    static-path-pattern: /**
    async:
      # 异步请求超时（PDF 渲染等 Callable 接口）：逐页渲染最多 15 页可能耗时较长，放宽到 120 秒
      request-timeout: 120000
  resources:
    static-locations: classpath:/static/

server:
  port: 9092
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    # 避免 DEBUG 级别把含 Authorization 头（厂商 API Key）的出站请求细节写入日志
    org.springframework.web: INFO
    reactor.netty.http.client: WARN
