spring:
  datasource:
    url: jdbc:sqlite:data/chatai.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite WAL 模式支持多读单写：小池提升读并发，写冲突由 busy_timeout 自动等待重试
      maximum-pool-size: 4
      minimum-idle: 1
      # 每个连接建立时下发的 SQLite PRAGMA（sqlite-jdbc 支持的连接属性）
      data-source-properties:
        journal_mode: WAL
        busy_timeout: 5000
        synchronous: NORMAL
  servlet:
    multipart:
      # 聊天图片/附件文档上传限制（业务层另有图片 5MB、文档 3MB 校验）
      max-file-size: 6MB
      max-request-size: 12MB
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: false
    content-type: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  codec:
    max-in-memory-size: 16MB
  mvc:
    static-path-pattern: /**
    async:
      # 异步请求超时（PDF 渲染等 Callable 接口）：逐页渲染最多 15 页可能耗时较长，放宽到 120 秒
      request-timeout: 120000
  resources:
    static-locations: classpath:/static/

server:
  port: 9092
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    # 避免 DEBUG 级别把含 Authorization 头（厂商 API Key）的出站请求细节写入日志
    org.springframework.web: INFO
    reactor.netty.http.client: WARN

# 模型健康检查定时任务默认值（复用 testConnection，指标持久化到模型配置供管理端展示）。
# 总开关与检查间隔的运行值以后台"系统设置-模型健康检查"为准（存 t_setting，保存后 1 分钟内生效，
# 无需重启）；此处仅作为后台未配置时的默认值与首次执行延迟，可用环境变量
# CHATAI_HEALTHCHECK_ENABLED / CHATAI_HEALTHCHECK_INTERVAL_MINUTES / CHATAI_HEALTHCHECK_INITIAL_DELAY_MINUTES 覆盖；
# 单个模型是否参与检查由后台"健康检查"开关控制（t_model_config.health_check_enabled，默认参与）
chatai:
  health-check:
    enabled: true
    interval-minutes: 360
    initial-delay-minutes: 5
