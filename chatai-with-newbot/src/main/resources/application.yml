spring:
  datasource:
    url: jdbc:sqlite:data/chatai.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  servlet:
    multipart:
      # 聊天图片/附件文档上传限制（业务层另有图片 5MB、文档 3MB 校验）
      max-file-size: 6MB
      max-request-size: 12MB
  thymeleaf:
    cache: false
    check-template: true
    check-template-location: true
    content-type: text/html
    enabled: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  codec:
    max-in-memory-size: 16MB
  mvc:
    static-path-pattern: /**
  resources:
    static-locations: classpath:/static/

server:
  port: 9092
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    # 避免 DEBUG 级别把含 Authorization 头（厂商 API Key）的出站请求细节写入日志
    org.springframework.web: INFO
    reactor.netty.http.client: WARN

# DeepSeek AI配置
ai:
  deepseek-key: sk-xxxx
  deepseek-url: https://api.deepseek.com/chat/completions

# 阿里通义千问动态模型配置
ali:
  tongyi:
    common:
      api-key: sk-xxxx
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1

# 通义千问系列模型配置
qwq-32b:
  ai:
    api-key: ${ali.tongyi.common.api-key}
    app-id:
    api-url: ${ali.tongyi.common.api-url}

qwen-plus-latest:
  ai:
    api-key: ${ali.tongyi.common.api-key}
    app-id: xxxx
    api-url: ${ali.tongyi.common.api-url}


