name: Build and Deploy chatai-with-newbot

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: chatai-with-newbot-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 web/package.json 和当前 jsdom/vue-i18n 的最低运行要求保持一致
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Verify and build Vue app
        working-directory: ./web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and build Spring Boot JAR
        working-directory: ./chatai-with-newbot
        run: |
          # data/ 被 Git 忽略，Actions 的全新检出不会包含该目录；SQLite 只能创建数据库文件，不能创建父目录。
          mkdir -p data
          mvn -B clean verify

      - name: Get JAR filename
        id: jar
        working-directory: ./chatai-with-newbot
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name 'chatai-with-newbot-*.jar' ! -name '*.original' -print -quit)
          test -n "$JAR_FILE"
          echo "file=chatai-with-newbot/$JAR_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT

      - name: Upload JAR via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "${{ steps.jar.outputs.file }}"
          target: "/opt/chatai-with-newbot/releases/"
          strip_components: 2
          rm: false
          command_timeout: 60s

      - name: Rename uploaded JAR on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            RELEASE_NAME="chatai-with-newbot-${{ github.sha }}.jar"
            UPLOADED_FILE="/opt/chatai-with-newbot/releases/${{ steps.jar.outputs.name }}"
            test -f "$UPLOADED_FILE"
            mv "$UPLOADED_FILE" "/opt/chatai-with-newbot/releases/${RELEASE_NAME}"
            echo "Renamed to ${RELEASE_NAME}"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            RELEASE_NAME="chatai-with-newbot-${{ github.sha }}.jar"
            bash /opt/chatai-with-newbot/deploy.sh ${RELEASE_NAME}

